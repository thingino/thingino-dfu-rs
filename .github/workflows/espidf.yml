name: ESP-IDF

# tdfu-usb's ESP-IDF backend (`crates/tdfu-usb/src/espidf/`) compiles only for the ESP32-S3
# the dev backpack runs on, so ci.yml's gate never sees it. This lints it for that target,
# with the toolchain, libclang and ESP-IDF the backpack firmware is built with.

on:
  push:
    branches: [main]
    paths:
      - crates/tdfu-usb/**
      - Cargo.toml
      - Cargo.lock
      - clippy.toml
      - .github/workflows/espidf.yml
  pull_request:
    paths:
      - crates/tdfu-usb/**
      - Cargo.toml
      - Cargo.lock
      - clippy.toml
      - .github/workflows/espidf.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: espidf-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pinned as ci.yml pins its tools: an exact release, and the sha256 of each asset as it
  # was when the pin was written, checked against this file rather than anything beside
  # the asset. Bumping one means recording its checksums in the same commit:
  #   gh api repos/<owner>/<repo>/releases/tags/<tag> --jq '.assets[] | [.name,.digest] | @tsv'
  #
  # The Xtensa Rust toolchain (the ESP32-S3 is not an upstream target).
  ESP_RUST_VERSION: "1.97.0.0"
  ESP_RUST_SHA256: "a99bfee69221e9ff6d86388f6811ee688cd405e6a0400a3cd1784e8d463e9d99"
  ESP_RUST_SRC_SHA256: "568d688b9f8f332ec4d04657544fad23e99ce11e9e6cf5835979e68a28c68b73"
  # The libclang bindgen needs to read ESP-IDF's Xtensa headers.
  ESP_CLANG_VERSION: "esp-20.1.1_20250829"
  ESP_CLANG_SHA256: "0128e2a86b262e3edfce026034ede07e2f45732b10c6cb8ac522c8f4c72befd8"
  # ESP-IDF by commit, which pins its submodules as well; the tag only names the clone.
  # The compilers it installs are checked against the sha256s in its own tools.json.
  ESP_IDF_TAG: "v5.5.5"
  ESP_IDF_COMMIT: "b774170ff46c393eeb5e495ea37936038d3f4f4f"
  MCU: esp32s3
  ESP_IDF_TOOLS_INSTALL_DIR: global
  CARGO_TARGET_XTENSA_ESP32S3_ESPIDF_RUSTFLAGS: "--cfg espidf_time64"

jobs:
  clippy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out
        run: |
          git init -q .
          # The token on the fetch, never in .git/config: see ci.yml's gate job.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            fetch -q --depth 1 --no-tags "https://github.com/${GITHUB_REPOSITORY}" "$SHA"
          git checkout -q FETCH_HEAD

      - name: Environment
        run: |
          {
            echo "IDF_PATH=$HOME/esp/esp-idf"
            echo "LIBCLANG_PATH=$HOME/.rustup/toolchains/esp/xtensa-esp32-elf-clang/$ESP_CLANG_VERSION/esp-clang/lib"
          } >> "$GITHUB_ENV"

      # The toolchains are most of the run: 180 MB of Rust, 80 MB of libclang, ESP-IDF and
      # the compilers it installs, some 3 GB unpacked. They are cached under their pins, so
      # a run downloads them again only when a pin above moves. `actions/cache` is the one
      # action in this file because gh can list and delete caches but cannot save or
      # restore one; it is pinned by commit.
      - name: Restore the toolchains
        id: toolchains
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/esp/esp-idf
            ~/.espressif
          key: espidf-toolchains-${{ runner.os }}-${{ env.ESP_RUST_VERSION }}-${{ env.ESP_CLANG_VERSION }}-${{ env.ESP_IDF_COMMIT }}

      - name: Install the Xtensa Rust toolchain and libclang
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          tmp=$(mktemp -d)
          rust="rust-${ESP_RUST_VERSION}-x86_64-unknown-linux-gnu"
          src="rust-src-${ESP_RUST_VERSION}"
          gh release download "v${ESP_RUST_VERSION}" -R esp-rs/rust-build \
            --pattern "$rust.tar.xz" --pattern "$src.tar.xz" --dir "$tmp"
          ( cd "$tmp" && printf '%s  %s\n' "$ESP_RUST_SHA256" "$rust.tar.xz" "$ESP_RUST_SRC_SHA256" "$src.tar.xz" \
              | sha256sum -c - )
          # The archives unpack as `rust-nightly-*` and `rust-src-nightly`, whatever the
          # version: stripped into directories named here instead.
          mkdir "$tmp/rust" "$tmp/src"
          tar xJf "$tmp/$rust.tar.xz" -C "$tmp/rust" --strip-components=1
          tar xJf "$tmp/$src.tar.xz" -C "$tmp/src" --strip-components=1
          # A directory under ~/.rustup/toolchains is a toolchain rustup knows by that name.
          dest="$HOME/.rustup/toolchains/esp"
          bash "$tmp/rust/install.sh" --destdir="$dest" --prefix="" --disable-ldconfig \
            --without=rust-docs-json-preview,rust-docs
          bash "$tmp/src/install.sh" --destdir="$dest" --prefix="" --disable-ldconfig

          clang="libs-clang-${ESP_CLANG_VERSION}-x86_64-linux-gnu.tar.xz"
          gh release download "$ESP_CLANG_VERSION" -R espressif/llvm-project --pattern "$clang" --dir "$tmp"
          ( cd "$tmp" && echo "$ESP_CLANG_SHA256  $clang" | sha256sum -c - )
          mkdir -p "$dest/xtensa-esp32-elf-clang/$ESP_CLANG_VERSION"
          tar xJf "$tmp/$clang" -C "$dest/xtensa-esp32-elf-clang/$ESP_CLANG_VERSION"
          rm -rf "$tmp"

      - name: Fetch ESP-IDF
        if: steps.toolchains.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 --branch "$ESP_IDF_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/espressif/esp-idf "$IDF_PATH"
          got=$(git -C "$IDF_PATH" rev-parse HEAD)
          test "$got" = "$ESP_IDF_COMMIT" || { echo "$ESP_IDF_TAG is $got, not $ESP_IDF_COMMIT"; exit 1; }

      - name: Toolchain
        run: |
          cargo +esp --version
          cargo +esp clippy --version

      # ESP-IDF's own build, keyed on the lockfile: a run whose dependencies did not move
      # skips the CMake build of the whole IDF.
      - name: Restore the ESP-IDF build
        id: build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: espidf-build-${{ runner.os }}-${{ env.ESP_RUST_VERSION }}-${{ env.ESP_IDF_COMMIT }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: espidf-build-${{ runner.os }}-${{ env.ESP_RUST_VERSION }}-${{ env.ESP_IDF_COMMIT }}-

      # A plain check first: it runs esp-idf-sys's build, which installs the IDF's
      # compilers into ~/.espressif, so the toolchain cache is saved complete, and even
      # when the lint below fails.
      - name: Build ESP-IDF
        id: idf
        run: cargo +esp check --locked -p tdfu-usb --target xtensa-esp32s3-espidf -Zbuild-std=std,panic_abort --all-features

      - name: Save the toolchains
        if: steps.toolchains.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/esp/esp-idf
            ~/.espressif
          key: ${{ steps.toolchains.outputs.cache-primary-key }}

      - name: Clippy (xtensa-esp32s3-espidf)
        run: >-
          cargo +esp clippy --locked -p tdfu-usb --target xtensa-esp32s3-espidf
          -Zbuild-std=std,panic_abort --all-features -- -D warnings

      - name: Save the ESP-IDF build
        if: always() && steps.idf.outcome == 'success' && steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: ${{ steps.build.outputs.cache-primary-key }}
